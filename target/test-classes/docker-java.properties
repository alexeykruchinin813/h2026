# Принудительная версия Docker Remote API.
#
# Корень проблемы: Docker Desktop 29.x (Engine API 1.56) поднял минимально
# допустимую версию API и отвечает "400 Bad Request" на legacy-запросы v1.32,
# которые docker-java подставляет по умолчанию.
#
# Важно: docker-java НЕ читает System properties вида -Ddocker-java.api.version
# (в отличие от common property-mapping). Конфигурация берётся из:
#   1) classpath:/docker-java.properties          <- этот файл
#   2) DOCKER_* переменных окружения              <- дублируем через surefire <environmentVariables>
# Поэтому фиксируем api.version здесь, а не в Java-коде.
api.version=1.44
