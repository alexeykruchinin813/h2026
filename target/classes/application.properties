server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/heat_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:heat_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:heat_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Логирование SQL (опционально, для отладки)
logging.level.org.springframework.jdbc.core=DEBUG

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.table=flyway_schema_history

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=3GB
spring.servlet.multipart.max-request-size=3GB

springdoc.swagger-ui.path=/swagger-ui.html


logging.level.ru.dit.heattracer=INFO
logging.level.org.example=INFO