# Docker Desktop 29.x: именованный канал \\.\pipe\docker_cli — CLI-прокси,
# отвечает 400 на docker API. Подключаемся по TCP (в Docker Desktop нужно
# включить Settings -> General -> "Expose daemon on tcp://localhost:2375 without TLS").
docker.host=tcp://localhost:2375
transport.type=httpclient5

# Увеличить таймаут ожидания ответа Docker API (медленный старт daemon после restart)
DOCKER_CLIENT_TIMEOUT=120
