# Логирование Testcontainers/docker-java в тестах: INFO вместо DEBUG-шума,
# но с сохранением сообщений об ошибках выбора Docker-стратегии.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.testcontainers=info
org.slf4j.simpleLogger.log.com.github.dockerjava=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
